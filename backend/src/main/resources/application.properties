spring.application.name=backend

# Lee backend/.env si existe (ver .env.example). En producción van variables de entorno reales.
spring.config.import=optional:file:.env[.properties]

# Sin valor por defecto a propósito: sin JWT_SECRET la app no arranca.
app.jwt.secret=${JWT_SECRET}

# El esquema lo crea Flyway. Hibernate sólo comprueba que las entidades coincidan.
spring.jpa.hibernate.ddl-auto=validate
