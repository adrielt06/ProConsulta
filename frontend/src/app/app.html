<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" routerLink="/metricas" (click)="closeMenu()" aria-label="ProConsulta, ir a Métricas">
      <span class="brand-mark"><app-icon name="heart" [size]="16" /></span>
      <span class="brand-name">ProConsulta</span>
    </a>

    <button
      class="nav-toggle icon-btn"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-nav"
      aria-label="Abrir menú de navegación"
    >
      <app-icon [name]="menuOpen() ? 'x' : 'menu'" />
    </button>

    <nav id="main-nav" class="nav" [class.nav--open]="menuOpen()" aria-label="Navegación principal">
      @for (item of navItems; track trackNav($index, item)) {
        <a
          class="nav-link"
          [routerLink]="item.route"
          routerLinkActive="nav-link--active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMenu()"
        >
          <app-icon [name]="item.icon" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="topbar-actions">
      <a class="btn btn--primary" routerLink="/agenda">
        <app-icon name="plus" [size]="16" />
        <span>Nuevo turno</span>
      </a>
      <button class="icon-btn" type="button" aria-label="Notificaciones">
        <app-icon name="bell" />
      </button>
      <a
        class="avatar avatar--sm"
        routerLink="/perfil"
        [attr.aria-label]="'Perfil: ' + professional.displayName"
        [title]="professional.displayName"
      >
        {{ professional.initials }}
      </a>
    </div>
  </div>
</header>

<main class="content">
  <router-outlet />
</main>
